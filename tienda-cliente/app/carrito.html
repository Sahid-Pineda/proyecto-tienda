<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu carrito — Vértice Deportes</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="nav">
  <div class="contenedor nav-inner">
    <a href="index.html" class="marca"><span class="corte"></span>VÉRTICE DEPORTES</a>
    <div class="nav-links"><a href="index.html">Catálogo</a></div>
    <div style="display:flex; align-items:center; gap:1rem">
      <div class="nav-usuario" data-zona-usuario></div>
      <a href="carrito.html" class="nav-carrito">🛒 Carrito <span class="badge-cantidad" data-badge-carrito>0</span></a>
    </div>
  </div>
</nav>

<header class="hero" style="padding-block:2.2rem 1.6rem">
  <div class="contenedor">
    <p class="hero-eyebrow">Paso 1 de 2</p>
    <h1 style="font-size:clamp(2rem,4vw,2.8rem)">TU CARRITO</h1>
  </div>
</header>

<main class="contenedor">
  <div class="layout-carrito">
    <section data-lista-items></section>

    <aside class="resumen">
      <h2>Resumen</h2>
      <div class="fila-resumen"><span>Subtotal</span><span class="valor" data-subtotal>L. 0.00</span></div>
      <div class="fila-resumen"><span>ISV (15%)</span><span class="valor" data-impuesto>L. 0.00</span></div>
      <div class="fila-resumen total"><span>Total</span><span class="valor" data-total>L. 0.00</span></div>
      <button type="button" class="btn btn-primario btn-block" style="margin-top:1.2rem" data-btn-pagar>
        Continuar a pago
      </button>
      <a href="index.html" class="btn btn-secundario btn-block" style="margin-top:0.6rem">Seguir comprando</a>
    </aside>
  </div>
</main>

<footer class="pie">Proyecto Final · Paradigmas de Programación · UNAH 2026</footer>

<script type="module" src="assets/js/pages/carrito.js"></script>
</body>
</html>
